server: { port: 8080 }
spring:
  application: { name: api-gateway }
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates: [ Path=/api/orders/** ]
          filters:
            - name: CircuitBreaker
              args: { name: orderCircuit, fallbackUri: forward:/fallback/orders }
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates: [ Path=/api/inventory/** ]
          filters:
            - name: CircuitBreaker
              args: { name: inventoryCircuit, fallbackUri: forward:/fallback/inventory }
    loadbalancer: { enabled: true }
  resilience4j:
    circuitbreaker:
      instances:
        orderCircuit: { slidingWindowSize: 5, failureRateThreshold: 50, waitDurationInOpenState: 10s, permittedNumberOfCallsInHalfOpenState: 2 }
        inventoryCircuit: { slidingWindowSize: 5, failureRateThreshold: 50, waitDurationInOpenState: 10s, permittedNumberOfCallsInHalfOpenState: 2 }
eureka.client.service-url.defaultZone: http://eureka-server:8761/eureka/
management.endpoints.web.exposure.include: health,info,metrics
